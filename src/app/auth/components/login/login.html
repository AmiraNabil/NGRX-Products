<div class="vh-100 d-flex align-items-center justify-content-center bg-light">
  <div class="col-lg-4 col-md-5 col-sm-8">
    <div class="text-center mb-4">
      <h2 class="fw-bold">Sign In</h2>
    </div>

    <div class="card border-0 shadow-md rounded-4">
      <div class="card-body p-4">
        <div class="alert alert-danger d-flex align-items-center gap-2" *ngIf="store.error()">
          <i class="fa-solid fa-circle-exclamation flex-shrink-0"></i>
          <span class="flex-grow-1 small">{{ store.error() }}</span>
        </div>

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <!-- Email -->
          <div class="mb-3">
            <label class="form-label fw-semibold small">Email Address</label>
            <div class="input-group mb-3">
              <span class="input-group-text" id="basic-addon1">
                <i class="fa-solid fa-envelope text-muted"></i>
              </span>
              <input
                input
                type="email"
                class="form-control"
                [class.is-invalid]="isInvalid('email')"
                formControlName="email"
                placeholder="Your email"
              />
            </div>
            <div class="invalid-feedback">{{ getError('email') }}</div>
          </div>

          <!-- Password -->
          <div class="mb-4">
            <label class="form-label fw-semibold small">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="fa-solid fa-lock text-muted"></i>
              </span>
              <input
                [type]="showPassword ? 'text' : 'password'"
                class="form-control"
                [class.is-invalid]="isInvalid('password')"
                formControlName="password"
                placeholder="Add your password"
              />
              <button
                type="button"
                class="input-group-text bg-light border-start-0"
                (click)="togglePassword()"
              >
                <i
                  class="fa-solid text-muted"
                  [class.fa-eye]="showPassword"
                  [class.fa-eye-slash]="!showPassword"
                ></i>
              </button>
            </div>
            <div class="invalid-feedback">{{ getError('password') }}</div>
          </div>

          <!-- Submit -->
          <button type="submit" class="btn btn-dark w-100 py-2" [disabled]="loading">
            <span class="spinner-border spinner-border-sm me-2" *ngIf="loading"></span>

            {{ loading ? 'Signing in...' : 'Sign In' }}
          </button>
        </form>
      </div>
    </div>

    <div class="card border-0 bg-warning-subtle mt-3 rounded-4">
      <div class="card-body p-3 d-flex flex-column gap-1">
        <small class="text-danger"> <strong>Email: </strong> john@mail.com </small>
        <small class="text-danger"> <strong>Password: </strong> changeme </small>
      </div>
    </div>
  </div>
</div>
